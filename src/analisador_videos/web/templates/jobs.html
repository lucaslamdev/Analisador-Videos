{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<h1>Jobs</h1>
<table class="table">
  <thead>
    <tr><th>ID</th><th>Vídeo</th><th>Status</th><th>Progresso</th><th>Etapa</th><th>Erro</th></tr>
  </thead>
  <tbody>
  {% for job in jobs %}
    <tr>
      <td><code>{{ job.id }}</code></td>
      <td>{{ job.video_id }}</td>
      <td>{{ job.status }}</td>
      <td>
        <div class="progress" style="height:20px">
          <div class="progress-bar" style="width:{{ job.progress_pct }}%">{{ job.progress_pct }}%</div>
        </div>
      </td>
      <td>{{ job.stage or '—' }}</td>
      <td class="text-danger small">{{ job.error_message or '' }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
